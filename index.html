
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #102b40, #050b13 65%);
  color: #dff8ff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 750px;
  text-align: center;
}

h1 {
  color: #58dfff;
  letter-spacing: 12px;
  font-size: 42px;
  text-shadow: 0 0 20px #00bfff;
}

.subtitle {
  color: #8baebc;
  letter-spacing: 4px;
  font-size: 12px;
}

.reactor {
  width: 190px;
  height: 190px;
  border: 3px solid #37dfff;
  border-radius: 50%;
  margin: 45px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px #00bfff, inset 0 0 25px #00bfff;
  animation: pulse 3s infinite;
}

.reactor span {
  font-size: 65px;
  color: #70eaff;
}

@keyframes pulse {
  50% { box-shadow: 0 0 55px #00bfff, inset 0 0 40px #00bfff; }
}

.status {
  color: #57dfff;
  margin: 20px;
  min-height: 20px;
}

.response {
  background: rgba(20, 55, 75, 0.55);
  border: 1px solid #236b85;
  border-radius: 12px;
  padding: 20px;
  min-height: 80px;
  margin: 20px 0;
  line-height: 1.6;
}

input {
  width: 70%;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #38cfff;
  background: #071522;
  color: white;
  outline: none;
}

button {
  padding: 13px 18px;
  margin: 6px;
  border: 1px solid #39dfff;
  border-radius: 8px;
  background: #0b2638;
  color: #70eaff;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #16445e;
  box-shadow: 0 0 12px #00bfff;
}

.mic {
  padding: 17px 35px;
  font-size: 16px;
  margin-top: 15px;
}

.footer {
  color: #567888;
  font-size: 11px;
  margin-top: 40px;
}
</style>
</head>

<body>
<div class="container">

  <h1>J.A.R.V.I.S.</h1>
  <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

  <div class="reactor">
    <span>◉</span>
  </div>

  <div class="status" id="status">SYSTEM ONLINE</div>

  <div class="response" id="response">
    Good day. JARVIS is ready. How may I assist you?
  </div>

  <input id="command" type="text"
    placeholder="Type a command...">

  <button onclick="processCommand()">EXECUTE</button>

  <br>

  <button class="mic" onclick="startListening()">
    🎙 ACTIVATE VOICE
  </button>

  <div>
    <button onclick="processQuick('open google')">Google</button>
    <button onclick="processQuick('open youtube')">YouTube</button>
    <button onclick="processQuick('open gmail')">Gmail</button>
    <button onclick="processQuick('open calendar')">Calendar</button>
  </div>

  <div class="footer">
    JARVIS AI | PERSONAL ASSISTANT | VERSION 1.0
  </div>

</div>

<script>
const statusBox = document.getElementById("status");
const responseBox = document.getElementById("response");
const commandInput = document.getElementById("command");

let recognition = null;
let listening = false;
let waitingForCommand = false;
let speaking = false;

function startRecognition() {
  if (!listening || speaking || !recognition) return;

  try {
    recognition.start();
  } catch (error) {
    // Recognition may already be starting.
  }
}

function speak(message) {
  speechSynthesis.cancel();

  if (recognition) {
    speaking = true;
    try { recognition.stop(); } catch (e) {}
  }

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "en-IN";
  speech.rate = 0.95;
  speech.pitch = 0.9;

  speech.onend = function() {
    speaking = false;
    startRecognition();
  };

  speech.onerror = function() {
    speaking = false;
    startRecognition();
  };

  speechSynthesis.speak(speech);
}

function respond(message) {
  responseBox.textContent = message;
  speak(message);
}

function processQuick(command) {
  commandInput.value = command;
  processCommand();
}

function processCommand() {
  const command = commandInput.value.trim().toLowerCase();

  if (!command) {
    respond("Please give me a command.");
    return;
  }

  statusBox.textContent = "PROCESSING COMMAND...";

  if (command.includes("search for")) {
    const query = command.split("search for").pop().trim();
    respond("Searching Google for " + query);
    window.open(
      "https://www.google.com/search?q=" + encodeURIComponent(query),
      "_blank"
    );
  }

  else if (command.startsWith("open ")) {
    const site = command.replace("open ", "").trim();

    const websites = {
      "google": "https://www.google.com",
      "youtube": "https://www.youtube.com",
      "gmail": "https://mail.google.com",
      "calendar": "https://calendar.google.com",
      "github": "https://github.com",
      "spotify": "https://open.spotify.com",
      "chatgpt": "https://chatgpt.com"
    };

    if (websites[site]) {
      respond("Opening " + site);
      window.open(websites[site], "_blank");
    } else {
      respond("Searching Google for " + site);
      window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(site),
        "_blank"
      );
    }
  }

  else if (command.includes("time")) {
    respond("The current time is " +
      new Date().toLocaleTimeString("en-IN"));
  }

  else if (command.includes("hello")) {
    respond("Hello. All systems are functioning normally.");
  }

  else if (command.includes("how are you")) {
    respond("All systems operational. Ready for your next command.");
  }

  else if (command.includes("who are you")) {
    respond("I am JARVIS, your personal voice controlled assistant.");
  }

  else {
    respond("I could not recognise that command. Please try again.");
  }

  statusBox.textContent = "SYSTEM ONLINE";
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    respond("Voice recognition is not supported. Please use Chrome.");
    return;
  }

  if (listening) return;

  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = true;
  recognition.interimResults = false;

  listening = true;
  waitingForCommand = false;

  recognition.onstart = function() {
    if (!speaking) {
      statusBox.textContent = "LISTENING FOR HELLO JARVIS...";
    }
  };

  recognition.onresult = function(event) {
    const result =
      event.results[event.results.length - 1];

    if (!result.isFinal) return;

    const transcript = result[0].transcript
      .trim()
      .toLowerCase();

    if (!waitingForCommand) {
      if (transcript.includes("hello jarvis")) {
        waitingForCommand = true;

        respond("Yes, Yaksh. What can I do for you?");
      }
    } else {
      waitingForCommand = false;
      commandInput.value = transcript;
      processCommand();
    }
  };

  recognition.onerror = function(event) {
    if (event.error === "not-allowed") {
      listening = false;
      statusBox.textContent = "MICROPHONE PERMISSION DENIED";
    }
  };

  recognition.onend = function() {
    if (listening && !speaking) {
      setTimeout(startRecognition, 500);
    }
  };

  startRecognition();
}

commandInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    processCommand();
  }
});
</script>
</body>
</html>
